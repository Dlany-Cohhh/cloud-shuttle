# PikPak 多账号下载器（云梭 CloudShuttle）· 最小可运行部署示例（所有敏感值都来自 .env，本文件可安全提交）
#
#   一键部署：Linux  bash scripts/deploy.sh   /  Windows  双击 scripts\deploy.bat
#   手动部署：cp .env.example .env 改好路径与凭据，
#             在 RCLONE_CONFIG_DIR 放好 rclone.conf（见 docs/DEPLOYMENT.md），
#             docker compose -f docker-compose.example.yml up -d --build
#
# 网络说明：示例沿用线上部署的 host 网络（飞牛 fnOS 的 bridge 端口映射不可达），
# 控制台直接占用 5566 端口。Windows Docker Desktop 请叠加 docker-compose.windows.yml
# 改用 bridge + 端口映射；无论哪种模式，控制台都需通过 docker.sock 访问 rclone-backend。
services:
  download-console:
    build: .
    image: download-console:local
    container_name: download-console
    restart: unless-stopped
    network_mode: host
    environment:
      RCLONE_RC_USER: ${RCLONE_RC_USER:?请在 .env 中设置 RCLONE_RC_USER}
      RCLONE_RC_PASS: ${RCLONE_RC_PASS:?请在 .env 中设置 RCLONE_RC_PASS}
      CONSOLE_DATA_DIR: /app
      # 代理地址：设置页「自定义代理地址」优先于它；off = 不走代理
      PROXY_URL: ${PROXY_URL:-http://127.0.0.1:7890}
      # 采集脚本回推地址；不设时按浏览器 Host 头自动判断
      CONSOLE_PUBLIC_HOST: ${CONSOLE_PUBLIC_HOST:-localhost:5566}
      # 在线检查更新（可选，见 docs/UPDATE.md）
      UPDATE_REPO: ${UPDATE_REPO:-Dlany-Cohhh/cloud-shuttle}
      UPDATE_CONTAINER: download-console
      UPDATE_AUTO_RESTART: ${UPDATE_AUTO_RESTART:-1}
      # 可选：自定义容器名 / 端口（多套部署或端口冲突时）。改这里要同步改
      # rclone-backend 的 container_name，并设置对应环境变量；默认值即本文件的约定。
      # RCLONE_CONTAINER: rclone-backend
      # v3.80：容器内挂载点。改了下面 volumes 的右侧就必须同步改这两个，否则
      # 控制台找不到下载目录（docker.sock 不可用时尤其如此 —— 那是唯一的线索）。
      CONSOLE_DOWNLOAD_ROOT: ${CONSOLE_DOWNLOAD_PATH:-/vol2/download}
      RCLONE_DATA_ROOT: ${RCLONE_DOWNLOAD_PATH:-/data}
      # PORT: 5566            # 控制台监听端口（Windows bridge 映射同步改 WEB_PORT）
      # RC_PORT: 5572         # rclone 主守护进程（直连）
      # PROXY_RC_PORT: 5573   # 代理下载守护进程
      # GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      # 代码目录同时是数据目录：jobs.json / settings.json 等直接落在这里
      - ${PROJECT_ROOT:?请在 .env 中设置 PROJECT_ROOT}:/app
      # 控制台通过 docker exec 指挥 rclone-backend
      - /var/run/docker.sock:/var/run/docker.sock
      # 磁盘空间保护 + 「本地文件」页浏览
      - ${DOWNLOAD_ROOT:?请在 .env 中设置 DOWNLOAD_ROOT}:${CONSOLE_DOWNLOAD_PATH:-/vol2/download}

  rclone-backend:
    image: rclone/rclone:latest
    container_name: rclone-backend
    restart: unless-stopped
    network_mode: host
    # 可选：让下载出来的文件归宿主机管理员所有（按需改成自己的 uid:gid）
    # user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      # rclone.conf 含账号 refresh_token，只挂载、绝不进仓库
      - ${RCLONE_CONFIG_DIR:?请在 .env 中设置 RCLONE_CONFIG_DIR}:/config/rclone
      - ${DOWNLOAD_ROOT:?请在 .env 中设置 DOWNLOAD_ROOT}:${RCLONE_DOWNLOAD_PATH:-/data}
    # 纯后端模式：rc 只绑本机回环，控制台经 docker exec 调用
    command: >
      rcd
      --rc-addr 127.0.0.1:5572
      --rc-user ${RCLONE_RC_USER}
      --rc-pass ${RCLONE_RC_PASS}
      --log-level INFO

  # ── 可选：代理下载 ────────────────────────────────────────────────
  # 控制台会按需拉起 127.0.0.1:5573 的第二个 rcd 进程，并注入 PROXY_URL
  # 作为它的 HTTP(S)_PROXY（见 download-console.py 的 proxy_url / proxy_rcd_cmd）。
  # PROXY_URL 可以是任意 http(s)/socks5 地址，不一定要跑下面这个 mihomo 容器；
  # Windows Docker Desktop 里访问宿主机代理请用 http://host.docker.internal:7890。
  # mihomo:
  #   image: metacubex/mihomo:latest
  #   container_name: mihomo
  #   restart: unless-stopped
  #   network_mode: host
  #   volumes:
  #     - ./mihomo:/root/.config/mihomo

  # ── 可选扩展：OpenList（聚合网盘）/ aria2（BT 磁力）/ yt-dlp（视频站）──
  # 启用后控制台「下载任务」页会多出对应入口，完整片段见 docs/DEPLOYMENT.md。
